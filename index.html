<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Unlocked | System Entry</title>
    <style>
        :root { --accent: #00d4ff; --bg: #0a0b10; --card: #161b22; --text: #e6edf3; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        
        /* Subtle background glow */
        body::before { content: ''; position: absolute; width: 300px; height: 300px; background: var(--accent); filter: blur(150px); opacity: 0.1; z-index: -1; }

        .landing-card { background: var(--card); padding: 3rem; border-radius: 16px; border: 1px solid #30363d; text-align: center; max-width: 550px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        h1 { font-size: 2.8rem; margin: 0; background: linear-gradient(to right, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        p { color: #8b949e; line-height: 1.6; font-size: 1.1rem; margin: 20px 0; }
        
        .enter-btn { display: inline-block; padding: 12px 40px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 6px; text-decoration: none; font-weight: 600; text-transform: uppercase; transition: all 0.3s; box-shadow: 0 0 15px rgba(0, 212, 255, 0.1); }
        .enter-btn:hover { background: var(--accent); color: #000; box-shadow: 0 0 30px rgba(0, 212, 255, 0.4); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="landing-card">
        <h1>JAVASCRIPT UNLOCKED</h1>
        <p>A comprehensive terminal for mastering the JavaScript ecosystem. Decipher the core, master the DOM, and conquer asynchronous architecture.</p>
        <a href="scheme.html" class="enter-btn">Initialize Core</a>
    </div>
</body>
</html>
